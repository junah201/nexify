[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nexify"
dynamic = ["version"]
description = "Nexify is a web framework for building APIs with AWS Lambda Python runetime based on standard Python type hints."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "junah201", email = "junah.dev@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Environment :: Web Environment",
    "Framework :: Nexify",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pydantic>=2.0.0,!=2.0.0,!=2.0.1,!=2.1.0,<3.0.0",
    "typing-extensions>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/junah201/nexify"
Documentation = "https://nexify.junah201.dev"
Repository = "https://github.com/junah201/nexify"
Issues = "https://github.com/junah201/nexify/issues"
Changelog = "https://nexify.junah201.dev/release-notes"

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff>=0.9.0",
]
test = [
    "mypy",
    "pytest",
    "pytest-cov",
]

[tool.pdm]
version = { source = "file", path = "nexify/__init__.py" }
distribution = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "B904",  # Allow raising exceptions without from e
]

[tool.ruff.lint.isort]
known-third-party = ["nexify", "pydantic"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"nexify/__init__.py" = ["F401"]
"tests/test_annotated_with_default.py" = ["B006"]
"tests/test_annotated_with_invalid_default.py" = ["B008"]